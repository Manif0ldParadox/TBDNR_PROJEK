name: tbdnr-projek
services:
  mongo:
    image: mongo:8.0@sha256:479e85ced54ffb8a40dade1dcde2da2a9ae858515b9415e9cc54bfb8f0575d01
    volumes:
      - dokumen:/data/db
    ports:
      - "127.0.0.1:27028:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
  neo4j:
    image: neo4j:5.26-community@sha256:577eb43120e8688e62e753e962c47d30044ecaa95147ee5386c29f226b878008
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-ruangnada-demo}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 384m
      NEO4J_server_memory_pagecache_size: 128m
      NEO4J_server_bolt_advertised__address: localhost:17687
    volumes:
      - graf:/data
    ports:
      - "127.0.0.1:17474:7474"
      - "127.0.0.1:17687:7687"
  app:
    build: ./app
    environment:
      MONGO_URI: mongodb://mongo:27017/
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-ruangnada-demo}
    depends_on:
      mongo:
        condition: service_healthy
      neo4j:
        condition: service_started
    ports:
      - "127.0.0.1:8088:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/catalog', timeout=3)"]
      interval: 8s
      timeout: 5s
      retries: 15
volumes:
  dokumen:
  graf:
